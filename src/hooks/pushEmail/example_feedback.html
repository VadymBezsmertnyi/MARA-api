<!DOCTYPE html>
<html lang="en">
  <body>
    <div>
      <h1 style="font-size: 2em; font-weight: bold; text-align: center">
        Запрос на зворотній звязок від {name}
      </h1>
      <p
        style="
          font-size: 1.5em;
          text-align: center;
          margin-top: 1em;
          margin-bottom: 1em;
        "
      >
        Користувач вказав:
      </p>
      <p
        style="
          font-size: 1.5em;
          text-align: center;
          margin-top: 1em;
          margin-bottom: 1em;
        "
      >
        Імя: {name}
      </p>
      <p
        style="
          font-size: 1.5em;
          text-align: center;
          margin-top: 1em;
          margin-bottom: 1em;
        "
      >
        Email: {email}
      </p>
      <p
        style="
          font-size: 1.5em;
          text-align: center;
          margin-top: 1em;
          margin-bottom: 1em;
        "
      >
        Номер телефону: {phone}
      </p>
      <p
        style="
          font-size: 1.5em;
          text-align: center;
          margin-top: 1em;
          margin-bottom: 1em;
        "
      >
        Коментар: {comment}
      </p>
    </div>
  </body>
</html>
